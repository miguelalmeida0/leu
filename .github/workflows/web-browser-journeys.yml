name: Leu browser journeys

# A required status must exist for every PR, including documentation-only changes.
# Path-filtered workflows may remain permanently pending when used as merge gates.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leu-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: chromium-and-webkit
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Voice lifecycle regression tests
        working-directory: web
        run: node --experimental-vm-modules --test scripts/voice-lifecycle.test.mjs scripts/voice-worker-lifecycle.test.mjs
      - name: Accessibility regression contracts
        working-directory: web
        run: node --test scripts/accessibility-contract.test.mjs
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Install pinned browser test package
        working-directory: web
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Parse-check browser scripts
        working-directory: web
        run: |
          for script in scripts/*-journeys.mjs; do node --check "$script"; done
      - name: Run reader journeys on desktop, Android and iPhone
        working-directory: web
        run: node scripts/browser-journeys.mjs
      - name: Verify static animation previews
        working-directory: web
        run: node scripts/scene-journeys.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-reader-and-scenes
          path: web/qa-evidence/
          if-no-files-found: warn
          retention-days: 7

  home:
    name: home-motion-accessibility
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Install pinned browser test package
        working-directory: web
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test Home animation, reduced motion and navigation
        working-directory: web
        run: node scripts/home-motion-journeys.mjs
      - name: Save motion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-home-motion
          path: web/qa-evidence/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: web-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [browser, home]
    steps:
      - name: Fail closed unless every browser suite passed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          HOME_RESULT: ${{ needs.home.result }}
        run: |
          echo "Reader/scene journeys: $BROWSER_RESULT"
          echo "Home reduced-motion journeys: $HOME_RESULT"
          if [ "$BROWSER_RESULT" != success ] || [ "$HOME_RESULT" != success ]; then
            echo '::error::Leu browser release gate failed; do not promote to main.'
            exit 1
          fi
