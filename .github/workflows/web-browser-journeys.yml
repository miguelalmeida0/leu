name: Leu browser journeys

on:
  # Experimental `test` pushes are not release gates. Use PR or manual runs.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-browser-journeys.yml'
  pull_request:
    branches: [main, test]
    paths:
      - 'web/**'
      - '.github/workflows/web-browser-journeys.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leu-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-and-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Install isolated browser test tooling
        working-directory: web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run desktop, Android-sized and iPhone-sized journeys
        working-directory: web
        run: node scripts/browser-journeys.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-browser-evidence
          path: web/qa-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
