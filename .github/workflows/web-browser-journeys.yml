name: Leu browser journeys

# A required status must exist for every PR, including documentation-only changes.
# Path-filtered workflows may remain permanently pending when used as merge gates.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leu-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: chromium-and-webkit
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Artwork and voice lifecycle regression tests
        working-directory: web
        run: node --experimental-vm-modules --test scripts/motion-assets.test.mjs scripts/voice-lifecycle.test.mjs scripts/voice-worker-lifecycle.test.mjs
      - name: Accessibility regression contracts
        working-directory: web
        run: node --test scripts/accessibility-contract.test.mjs
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Parse-check browser scripts
        working-directory: web
        run: |
          for script in scripts/*-journeys.mjs; do node --check "$script"; done
      - name: Verify burger navigation across desktop, tablet and mobile widths
        working-directory: web
        run: node scripts/topbar-layout-journeys.mjs
      - name: Verify compact toolbar, dialog close and responsive Home/book grids
        working-directory: web
        run: node scripts/responsive-reader-layout-journeys.mjs
      - name: Verify short-viewport chapter selection with mobile WebKit
        working-directory: web
        env:
          LEU_CONTENTS_CASE: webkit-keyboard
        run: node scripts/reader-contents-journeys.mjs
      - name: Run reader journeys on desktop, Android and iPhone
        working-directory: web
        run: node scripts/browser-journeys.mjs
      - name: Verify reading-room navigation, controls and saved progress
        working-directory: web
        run: node scripts/reading-room-journeys.mjs
      - name: Verify fitted screen pagination and touch viewport isolation
        working-directory: web
        run: node scripts/reader-pagination-journeys.mjs
      - name: Verify bounded searchable chapter navigation
        working-directory: web
        run: node scripts/reader-contents-journeys.mjs
      - name: Verify selected, hover and focus states across the app
        working-directory: web
        run: node scripts/interaction-state-journeys.mjs
      - name: Verify pull-to-exit gestures and haptic fallbacks
        working-directory: web
        run: node scripts/reader-dismiss-journeys.mjs
      - name: Verify static animation previews
        working-directory: web
        run: node scripts/scene-journeys.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-reader-and-scenes
          path: web/qa-evidence/
          if-no-files-found: warn
          retention-days: 7

  home:
    name: home-motion-accessibility
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Test Home animation, reduced motion and navigation
        working-directory: web
        run: node scripts/home-motion-journeys.mjs
      - name: Save motion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-home-motion
          path: web/qa-evidence/
          if-no-files-found: warn
          retention-days: 7

  stress:
    name: stress-${{ matrix.browser }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user pwuser
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app and test dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Stress responsive layouts, accessibility and resource failures
        working-directory: web
        env:
          LEU_STRESS_BROWSER: ${{ matrix.browser }}
        run: node scripts/stress-journeys.mjs
      - name: Save stress evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leu-stress-${{ matrix.browser }}
          path: web/qa-evidence/stress/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: web-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [browser, home, stress]
    steps:
      - name: Fail closed unless every browser suite passed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          HOME_RESULT: ${{ needs.home.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
        run: |
          echo "Reader/scene journeys: $BROWSER_RESULT"
          echo "Home reduced-motion journeys: $HOME_RESULT"
          echo "Stress matrix: $STRESS_RESULT"
          if [ "$BROWSER_RESULT" != success ] || [ "$HOME_RESULT" != success ] || [ "$STRESS_RESULT" != success ]; then
            echo '::error::Leu browser release gate failed; do not promote to main.'
            exit 1
          fi
