name: Shelf verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: leu-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  portable-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: ./scripts/test-core.sh
      - name: Structural checks
        run: python3 scripts/validate.py
  apple-platform:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and installed simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and run PDFKit and UI tests
        run: ./scripts/test-ios.sh
      - name: Save actual Xcode test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Shelf-xcresults
          path: .build/results/*.xcresult
          if-no-files-found: warn
