name: Shelf verification

on:
  # Keep work-in-progress `test` pushes silent; validate PRs and main.
  push:
    branches: [main]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: leu-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: ./scripts/test-core.sh
      - name: Structural checks
        run: python3 scripts/validate.py

# The full Apple-platform, PDFKit and UI suite intentionally lives in
# .github/workflows/ui-certification.yml and is run explicitly when native
# certification is required. It is not a push gate because GitHub macOS runners
# spend most of the job rebuilding the ONNX/Xcode graph and can hit runner
# limits before the deterministic test signal is returned.
