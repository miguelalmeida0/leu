name: Shelf verification
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: shelf-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: ./scripts/test-core.sh
      - name: Structural checks
        run: python3 scripts/validate.py

  apple-unit:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and installed simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and run Apple unit and PDFKit tests
        run: |
          ./scripts/test-ios.sh \
            -only-testing:ShelfTests \
            -skip-testing:ShelfTests/LearningRealModelP0Tests/testRealReactInferenceValidationPersistenceAndPlanning \
            -skip-testing:ShelfTests/QuestionContractV2IntegrationTests/testRealReactPageThreeHasMeaningfulRealizableClaimsAndExactPDFSpans
      - name: Save actual Xcode test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shelf-xcresults-unit
          path: .build/results/*.xcresult
          if-no-files-found: warn

  apple-ui:
    name: apple-ui-${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 110
    continue-on-error: ${{ matrix.soft_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            soft_fail: true
            only: >-
              -only-testing:ShelfUITests/ShelfEmotionalFlowUITests
              -only-testing:ShelfUITests/ShelfExplainLikeTenUITests
              -only-testing:ShelfUITests/ShelfRecoveryV25UITests
            skip: >-
              -skip-testing:ShelfUITests/ShelfEmotionalFlowUITests/test55DrawingCannotHideReleaseOrExitControls
              -skip-testing:ShelfUITests/ShelfEmotionalFlowUITests/test56DrainedCanFinishWithoutLosingCompletedHistory
              -skip-testing:ShelfUITests/ShelfExplainLikeTenUITests/testRealExplanationAndRefinementsStayOnPageThree
              -skip-testing:ShelfUITests/ShelfRecoveryV25UITests/test57ConfidenceControlsHaveEqualGeometryAndCompleteLabels
          - shard: b
            soft_fail: false
            only: >-
              -only-testing:ShelfUITests/ShelfInteractionRepairUITests
              -only-testing:ShelfUITests/ShelfReaderRegressionUITests
              -only-testing:ShelfUITests/ShelfStudyInteractionUITests
            skip: >-
              -skip-testing:ShelfUITests/ShelfInteractionRepairUITests/test22ReadVerticalScrollCrossesSourcePageBoundary
              -skip-testing:ShelfUITests/ShelfReaderRegressionUITests/test18EmptyBookmarksCanBookmarkCurrentPage
          - shard: c
            soft_fail: false
            only: >-
              -only-testing:ShelfUITests/ShelfLearningOSUITests
              -only-testing:ShelfUITests/ShelfStudyHomeUITests
              -only-testing:ShelfUITests/ShelfUITests
            skip: >-
              -skip-testing:ShelfUITests/ShelfLearningOSUITests/test32LearnTodayCreatesLocalStudySession
              -skip-testing:ShelfUITests/ShelfLearningOSUITests/test33QuestionCommitAndSourceRoundTrip
              -skip-testing:ShelfUITests/ShelfStudyHomeUITests/testContinueUsesRealRememberedSourceAndReturnsToReader
          - shard: d
            soft_fail: true
            only: >-
              -only-testing:ShelfUITests/ShelfSessionExperienceUITests
              -only-testing:ShelfUITests/ShelfSourceRecoveryP0UITests
              -only-testing:ShelfUITests/ShelfV27IntelligenceUITests
              -only-testing:ShelfUITests/ShelfWorldClassUITests
            skip: >-
              -skip-testing:ShelfUITests/ShelfSessionExperienceUITests/testMCQPredictionCommitFeedbackAndSourceRoundTrip
              -skip-testing:ShelfUITests/ShelfSessionExperienceUITests/testCompleteSessionReportsRealActivitiesAndReturnsToStudy
              -skip-testing:ShelfUITests/ShelfSessionExperienceUITests/testTypedRecallSurvivesExactSourceRoundTrip
              -skip-testing:ShelfUITests/ShelfSourceRecoveryP0UITests/test61ExistingReactQuestionChoicesExplanationSourceReturn
              -skip-testing:ShelfUITests/ShelfSourceRecoveryP0UITests/test62UninterruptedExistingLibraryReadLensStudySourceReturn
              -skip-testing:ShelfUITests/ShelfV27IntelligenceUITests/testTeachReactSourceRoundTripAndResumeActualThought
              -skip-testing:ShelfUITests/ShelfV27IntelligenceUITests/testV3AdmittedQuestionStudyFeedbackAndSourceRoundTrip
              -skip-testing:ShelfUITests/ShelfV27IntelligenceUITests/testCacheLabReuseStalenessAndRecompute
              -skip-testing:ShelfUITests/ShelfV27IntelligenceUITests/testReactKeysLabChangesIdentityWithExactSourceReturn
              -skip-testing:ShelfUITests/ShelfWorldClassUITests/test42ReaderConnectOpensCrossLibraryPassageExperience
              -skip-testing:ShelfUITests/ShelfWorldClassUITests/test50SemanticQuestionUsesFourLevelCertainty
              -skip-testing:ShelfUITests/ShelfWorldClassUITests/test51UnderstandingLensUsesVerifiedSourceFacts
              -skip-testing:ShelfUITests/ShelfWorldClassUITests/test53ActiveStudyContextSurvivesInterruption
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and installed simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and run UI shard
        env:
          ONLY_TESTS: ${{ matrix.only }}
          SKIP_TESTS: ${{ matrix.skip }}
        run: |
          read -r -a only_args <<< "$ONLY_TESTS"
          read -r -a skip_args <<< "$SKIP_TESTS"
          LEU_UI_CI_MAX_ATTEMPTS=2 ./scripts/run-ui-ci.sh "${only_args[@]}" "${skip_args[@]}"
      - name: Save actual Xcode test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shelf-xcresults-${{ matrix.shard }}
          path: .build/results/*.xcresult
          if-no-files-found: warn
