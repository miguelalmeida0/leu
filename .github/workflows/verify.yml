name: Shelf verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: leu-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: ./scripts/test-core.sh
      - name: Structural checks
        run: python3 scripts/validate.py

  apple-platform:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and installed simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Compile app plus all native test targets, then run native unit tests
        run: |
          set -euo pipefail
          source scripts/common.sh
          require_xcode
          choose_simulator
          boot_simulator
          mkdir -p .build/results
          COMMON=(
            -project Shelf.xcodeproj
            -scheme Shelf
            -configuration Debug
            -destination "platform=iOS Simulator,id=$SHELF_DEVICE"
            -destination-timeout 120
            -derivedDataPath .build/ios-ci
            -parallel-testing-enabled NO
            CODE_SIGNING_ALLOWED=NO
          )
          xcodebuild "${COMMON[@]}" build-for-testing
          RESULT=".build/results/Shelf-unit-$(date '+%Y%m%d-%H%M%S')-$$.xcresult"
          xcodebuild "${COMMON[@]}" -resultBundlePath "$RESULT" test-without-building -only-testing:ShelfTests
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Shelf-native-results
          path: .build/results/*.xcresult
          if-no-files-found: warn
          retention-days: 7
