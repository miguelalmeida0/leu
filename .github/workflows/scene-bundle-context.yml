name: Scene bundle integration

on:
  push:
    branches: [test]
    paths: ['.github/workflows/scene-bundle-context.yml']

permissions:
  contents: write

concurrency:
  group: leu-scene-bundle-integration
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Apply only the hash-verified scene changes
        run: python .github/integrate-scene-bundle.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Build candidate
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install isolated cross-engine browser tooling
        working-directory: web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify moving scenes and red sound bars
        working-directory: web
        run: node scripts/scene-journeys.mjs
      - name: Verify existing reader and mobile journeys
        working-directory: web
        run: node scripts/browser-journeys.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: leu-scene-integration-evidence
          path: web/qa-evidence/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Publish verified source to test without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test
          test "$(git rev-parse origin/test)" = "$GITHUB_SHA"
          git config user.name 'Miguel Almeida'
          git config user.email '94702822+miguelalmeida0@users.noreply.github.com'
          git add web/src/components/Dock.tsx web/src/lib/motion.ts web/src/scenes/Basket.tsx web/src/scenes/FoggedWindow.tsx web/src/scenes/SnowGlobe.tsx web/src/scenes/TeaSteam.tsx .github/workflows/web-browser-journeys.yml
          git diff --cached --check
          git commit -m 'feat(web): integrate supplied scene animations on mobile and desktop' -m 'Integrates the animation changes from supplied Git bundle 10a9c77491988ed2137e7425c35f1c182f32014a, extending idle playback to desktop. Preserves the current reader, search, zoom and system-voice fixes. Cross-engine scene and reader journeys passed before this commit.'
          git push origin HEAD:test
          echo "VERIFIED_SCENE_COMMIT=$(git rev-parse HEAD)"
