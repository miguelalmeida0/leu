name: Leu full UI certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leu-full-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ui:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Xcode and installed simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Run full PDFKit and UI certification suite
        run: ./scripts/test-ios.sh
      - name: Save full Xcode test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Shelf-full-ui-xcresults
          path: .build/results/*.xcresult
          if-no-files-found: warn
          retention-days: 7
