name: Home animation recovery
on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/home-motion-check.yml'
      - 'web/src/lib/sceneMotion.ts'
      - 'web/src/components/SceneMotionControl.*'
      - 'web/src/screens/Home.tsx'
      - 'web/src/scenes/FoggedWindow.tsx'
      - 'web/src/scenes/TeaSteam.tsx'
      - 'web/scripts/home-motion-journeys.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Build actual app
        working-directory: web
        run: npm ci && npm run build
      - name: Install test browsers
        working-directory: web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Existing app regressions
        working-directory: web
        run: |
          node scripts/browser-journeys.mjs
          node scripts/scene-journeys.mjs
      - name: Test actual Home route, not isolated illustrations
        working-directory: web
        run: node scripts/home-motion-journeys.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: home-motion-evidence
          path: |
            web/qa-evidence/*.png
            web/qa-evidence/home-*-diagnostics.json
          if-no-files-found: warn
          retention-days: 3
