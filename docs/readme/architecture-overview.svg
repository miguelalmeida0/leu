<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">Leu architecture</title><desc id="desc">Native study and separate browser companion. The React / Vite browser companion runs separately; no shared cloud library is required.</desc><rect width="960" height="456" fill="#fff"/><rect x="1" y="1" width="958" height="454" rx="15" fill="none" stroke="#D8E0E6"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="57" font-size="31" font-weight="700" fill="#15202C">Leu</text><text x="28" y="88" font-size="17" fill="#536171">Native study and separate browser companion</text><text x="932" y="57" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1" fill="#566E9B">SYSTEM MAP</text><rect x="28" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="28" y="124" width="288" height="5" rx="2" fill="#566E9B"/><text x="49" y="164" fill="#566E9B" font-size="13" font-weight="700" letter-spacing="1">INTERFACE</text><text x="49" y="207" fill="#15202C" font-size="23" font-weight="700">Native reader</text><text x="49" y="237" fill="#536171" font-size="16">SwiftUI / PDFKit</text><path d="M49 257h246" stroke="#D8E0E6"/><text x="49" y="285" font-size="16" fill="#233244">Passage selection</text><text x="49" y="317" font-size="16" fill="#233244">Annotations and navigation</text><rect x="346" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="346" y="124" width="288" height="5" rx="2" fill="#566E9B"/><text x="367" y="164" fill="#566E9B" font-size="13" font-weight="700" letter-spacing="1">APPLICATION</text><text x="367" y="207" fill="#15202C" font-size="23" font-weight="700">Local services</text><text x="367" y="237" fill="#536171" font-size="16">AppContainer / ShelfCore</text><path d="M367 257h246" stroke="#D8E0E6"/><text x="367" y="285" font-size="16" fill="#233244">Feature models and use cases</text><text x="367" y="317" font-size="16" fill="#233244">Portable domain contracts</text><rect x="664" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="664" y="124" width="288" height="5" rx="2" fill="#566E9B"/><text x="685" y="164" fill="#566E9B" font-size="13" font-weight="700" letter-spacing="1">PERSISTENCE</text><text x="685" y="207" fill="#15202C" font-size="23" font-weight="700">On-device library</text><text x="685" y="237" fill="#536171" font-size="16">DocumentVault / snapshots</text><path d="M685 257h246" stroke="#D8E0E6"/><text x="685" y="285" font-size="16" fill="#233244">Original PDFs remain intact</text><text x="685" y="317" font-size="16" fill="#233244">Sidecar annotations</text><path d="M321 227h20m-7-7 7 7-7 7" fill="none" stroke="#566E9B" stroke-width="2" stroke-linejoin="round"/><path d="M639 227h20m-7-7 7 7-7 7" fill="none" stroke="#566E9B" stroke-width="2" stroke-linejoin="round"/><rect x="28" y="366" width="904" height="59" rx="9" fill="#F0F4F6"/><rect x="28" y="366" width="4" height="59" rx="2" fill="#566E9B"/><text x="48" y="401" font-size="16" fill="#364556">The React / Vite browser companion runs separately; no shared cloud library is required.</text></g></svg>